[package]
name = "rwa-asset-type"
version = "0.1.0"
edition = "2021"
description = "Type script for the demo RWA asset cell (reference implementation, not a custodied instrument)."

[dependencies]
ckb-std = "0.16"

# Size matters on-chain: optimize the release build for code size.
[profile.release]
overflow-checks = true
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
