[package]
name = "rwa-asset-type"
version = "0.1.0"
edition = "2021"
description = "Type script for the demo RWA asset cell (reference implementation, not a custodied instrument)."

[dependencies]
# No `libc` feature: it compiles C code and needs a RISC-V C toolchain.
ckb-std = { version = "0.16", default-features = false, features = ["allocator", "ckb-types", "dummy-atomic"] }
blake2b-ref = "0.3"
